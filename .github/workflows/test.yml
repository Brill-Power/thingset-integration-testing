name: Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: 'true'

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.x'

    - name: Setup C Compiler
      run: |
        sudo apt-get update && sudo apt-get install -y cmake

    - name: Build Server
      working-directory: thingsetplusplus/examples/asioserver
      run: |
        cmake -S . -B build && cd build && make

    - name: Run Integration Tests
      working-directory: tests/ThingSet.Test.Integration
      run: |
        dotnet test