[project]
name = "thingset-integration-tests"
version = "0.0.0"
description = "Python client integration tests against the ThingSet fixture servers"
requires-python = ">=3.10"
dependencies = [
    # Pinned for the "pinned" CI job; the "latest" job runs with --upgrade-package.
    "python-thingset==0.5.3",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
filterwarnings = [
    # python-thingset's CAN transport trips a 3.14+ SyntaxWarning on import
    "ignore::SyntaxWarning",
]
